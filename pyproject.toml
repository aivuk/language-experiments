[project]
name = "language-experiments"
version = "0.1.0"
description = "Visualize books as linguistic fingerprints."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "requests>=2.31.0",
]

[project.scripts]
bookviz = "bookviz.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["bookviz"]
